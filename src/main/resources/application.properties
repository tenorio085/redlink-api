spring.application.name=redlink-api

# Porta: o Render informa a porta pela variavel de ambiente PORT
server.port=${PORT:8080}

# Banco Oracle da FIAP. Os valores NUNCA ficam no codigo: vem de variaveis de ambiente.
#   DB_URL      -> URL JDBC do Oracle
#   DB_USER     -> usuario do Oracle
#   DB_PASSWORD -> senha do Oracle
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Origens liberadas no CORS (separadas por virgula). Padrao: todas.
redlink.cors.origens=${CORS_ORIGINS:*}

# Erros: nunca devolver stack trace nem pagina HTML
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
