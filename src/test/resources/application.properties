# Configuracao usada SOMENTE nos testes automatizados: H2 em memoria imitando o Oracle.
# O schema e criado a partir do mesmo script entregue (sql/redlink.sql).
spring.datasource.url=jdbc:h2:mem:redlink;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:sql/redlink.sql
redlink.cors.origens=*
